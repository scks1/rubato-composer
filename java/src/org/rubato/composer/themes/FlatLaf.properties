# Rubato Composer additions shared by the light and dark FlatLaf themes.
# FlatLaf reads this file through org.rubato.composer.Theme.

# Slightly firmer focus rings and scroll bars than FlatLaf's defaults, so the
# keyboard focus stays visible on the network canvas and in dense dialogs.
Component.focusWidth = 2
Component.innerFocusWidth = 1
ScrollBar.showButtons = true
ScrollBar.width = 14
TabbedPane.showTabSeparators = true
SplitPane.dividerSize = 7
Table.showHorizontalLines = true
Table.showVerticalLines = true
