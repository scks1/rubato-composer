# Rubato colors for the light theme. Each key has a classic fallback in the
# code that reads it; see org.rubato.composer.Theme.

# network canvas
Rubato.canvas.background = #fbfaf7
Rubato.canvas.line = #3a3a3a
Rubato.canvas.selection = #2f6fc4
Rubato.canvas.selectionFill = #fffacd
Rubato.canvas.selectionLine = #cdc9a5
Rubato.canvas.problem = #c62828

# rubette boxes keep Rubato's moccasin, passthrough orange and selection violet
Rubato.rubette.background = #ffe4b5
Rubato.rubette.passthrough = #ff8247
Rubato.rubette.inselection = #9f79ee
Rubato.rubette.border = #9c7a40
Rubato.rubette.foreground = #000000

# connector states (linked, unlinked)
Rubato.connector.state0 = #2b63c6
Rubato.connector.state1 = #c62828

# status line and message log
Rubato.status.info = #000000
Rubato.status.warning = #8a5300
Rubato.status.error = #b3261e
Rubato.status.ok = #1b7a2e

# group headers in the rubette list
Rubato.group.background = #5c5c5c
Rubato.group.foreground = #ffffff

# 2D views (Display, geometry editors)
Rubato.view.background = #ffffff
Rubato.view.foreground = #000000
Rubato.view.axes = #6e6e6e
Rubato.view.grid = #4d4dff
Rubato.view.gridline = #c8c8c8

# entry fields holding invalid input
Rubato.entry.errorBackground = #ffb04d

# focus indicators need 3:1 against white and the panel background
Component.focusColor = #2f65ca
Component.focusedBorderColor = #2f65ca

# component outlines need 3:1 against the #f2f2f2 panel (pixel-sampled)
Component.borderColor = #858585
Button.borderColor = #858585
CheckBox.icon.borderColor = #858585
CheckBox.icon.selectedBorderColor = #2f65ca
CheckBox.icon.selectedBackground = #2f65ca
CheckBox.icon.checkmarkColor = #ffffff

# vector icons (toolbar, menus, rubette list); 3:1 or more against the
# #f2f2f2 panel and white menus
Rubato.icon.foreground = #4a4a4a
Rubato.icon.run = #1b7a2e
Rubato.icon.stop = #c62828

# buttons inside rubette boxes, and the inside of an unlinked connector ring
Rubato.rubette.buttonBackground = #fff3dc
Rubato.rubette.buttonHover = #fffaf0
Rubato.rubette.buttonBorder = #b8955a
Rubato.connector.ringFill = #fbfaf7

# network names in the Problems list, 4.5:1 or more against the list
Rubato.problem.secondary = #636363

# affine morphism editor: unit square, image (orientation kept or mirrored)
# and the handles of the points 0, 1 and 2
Rubato.affine.unit = #0000004d
Rubato.affine.image = #2fa84f80
Rubato.affine.mirror = #d6303080
Rubato.affine.handle0 = #2b63c6
Rubato.affine.handle1 = #a86f00
Rubato.affine.handle2 = #a8279a

# copyright line on the about picture, 4.5:1 or more against its blue
Rubato.about.foreground = #c9d3ff
