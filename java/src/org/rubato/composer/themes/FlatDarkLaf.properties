# Rubato colors for the dark theme. Each key has a classic fallback in the
# code that reads it; see org.rubato.composer.Theme.

# network canvas
Rubato.canvas.background = #2b2d30
Rubato.canvas.line = #b0b0b0
Rubato.canvas.selection = #e8e8e8
Rubato.canvas.selectionFill = #46452f
Rubato.canvas.selectionLine = #8a8660
Rubato.canvas.problem = #ff8a80

# rubette boxes: the light theme's hues at low lightness, with light text
Rubato.rubette.background = #4f3e24
Rubato.rubette.passthrough = #7e3c1f
Rubato.rubette.inselection = #4f3f86
Rubato.rubette.border = #9a7a48
Rubato.rubette.foreground = #dfe1e5

# connector states (unlinked, linked)
Rubato.connector.state0 = #6e9bf0
Rubato.connector.state1 = #f07167

# status line and message log
Rubato.status.info = #dfe1e5
Rubato.status.warning = #f0b850
Rubato.status.error = #ffa69c
Rubato.status.ok = #7ad18a

# group headers in the rubette list
Rubato.group.background = #4e5357
Rubato.group.foreground = #ffffff

# 2D views (Display, geometry editors)
Rubato.view.background = #2b2d30
Rubato.view.foreground = #dfe1e5
Rubato.view.axes = #9a9a9a
Rubato.view.grid = #7f9cff
Rubato.view.gridline = #45484c

# entry fields holding invalid input
Rubato.entry.errorBackground = #6b3a00

# focus indicators need 3:1 against the dark panel and field backgrounds
Component.focusColor = #6e9bf0
Component.focusedBorderColor = #6e9bf0

# component outlines need 3:1 against the #3c3f41 panel (pixel-sampled)
Component.borderColor = #939393
Button.borderColor = #939393
CheckBox.icon.borderColor = #939393
