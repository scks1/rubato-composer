name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maven:
    name: Maven verify (JDK 21)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # WallpaperRubetteTest opens a Swing component, so the tests need an X
      # display. JSynPlayerTest needs an audio device and is excluded by the
      # pom's without-audio profile.
      - name: Install Xvfb if missing
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      - name: Build and test
        run: xvfb-run -a mvn -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: |
            java/core/target/surefire-reports/
            java/io/target/surefire-reports/
            java/bigbang/target/surefire-reports/
            java/target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload runnable jar
        uses: actions/upload-artifact@v7
        with:
          name: rubato-composer-jar
          # The jar finds the Apache-licensed libraries in lib/ next to it.
          path: |
            java/target/rubato-composer-*-all.jar
            java/target/lib/
          if-no-files-found: error

      - name: Upload core library jar
        uses: actions/upload-artifact@v7
        with:
          name: rubato-core-jar
          # math, logeo, XML, Scheme and Denotex, with no AWT or Swing
          path: java/core/target/rubato-core-*.jar
          if-no-files-found: error

      - name: Upload I/O library jar
        uses: actions/upload-artifact@v7
        with:
          name: rubato-io-jar
          # MusicXML, MIDI files and OSC for Score denotators; needs rubato-core
          path: java/io/target/rubato-io-*.jar
          if-no-files-found: error

      - name: Upload BigBang library jar
        uses: actions/upload-artifact@v7
        with:
          name: rubato-bigbang-jar
          # BigBang's operations, operation graph and replay, and the headless
          # BigBang class; needs rubato-core
          path: java/bigbang/target/rubato-bigbang-*.jar
          if-no-files-found: error

  ant:
    name: Ant dist (JDK 21)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Ant if missing
        run: command -v ant || (sudo apt-get update && sudo apt-get install -y ant)

      - name: Build rubato.jar
        run: ant -f java/build.xml dist

      # Compiles java/core/src alone with only java.base, java.xml and
      # java.logging observable, so a core class that uses AWT, Swing or
      # the application fails here.
      - name: Build the core library alone
        run: ant -f java/build.xml core-jar

      # Compiles java/io/src against the core library alone, with the same
      # three modules observable.
      - name: Build the I/O library alone
        run: ant -f java/build.xml io-jar

      # Compiles java/bigbang/src against the core library alone, with the
      # same three modules observable.
      - name: Build the BigBang library alone
        run: ant -f java/build.xml bigbang-jar

  agda-spec:
    name: Agda spec (Agda 2.6.3 from Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The generator reads forms out of the composer jar.
      - name: Build the composer jar
        run: mvn -B -ntp -DskipTests package

      # agda-bin is the compiler; libghc-agda-dev carries the primitive
      # library under /usr/share/libghc-agda-dev/lib. The spec uses no
      # other library. `apt-get install` of the two packages pulls 67
      # packages (129 MB) of Haskell libraries the binary never loads, so
      # the job fetches only the two noble debs, checks them against the
      # SHA-256 sums from noble's universe Packages index, keeps them in
      # the Actions cache and unpacks them with dpkg-deb. agda-bin's own
      # run-time libraries (libc6, libffi8, libgmp10, libtinfo6, zlib1g)
      # ship with the ubuntu-24.04 image.
      - name: Restore the Agda debs
        id: agda-debs
        uses: actions/cache@v6
        with:
          path: ~/agda-debs
          key: agda-debs-noble-2.6.3-1build1-17d3b7d5-84c8810c

      - name: Download the Agda debs
        if: steps.agda-debs.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: |
          mkdir -p ~/agda-debs
          cd ~/agda-debs
          for deb in agda-bin_2.6.3-1build1_amd64.deb libghc-agda-dev_2.6.3-1build1_amd64.deb; do
            ok=
            # A mirror slower than 100 kB/s for 30 s is dropped for the next.
            for mirror in http://azure.archive.ubuntu.com/ubuntu http://archive.ubuntu.com/ubuntu https://mirrors.edge.kernel.org/ubuntu; do
              if curl -fsSL --retry 2 --speed-time 30 --speed-limit 100000 --max-time 180 \
                   -o "$deb" "$mirror/pool/universe/a/agda/$deb"; then
                echo "$deb from $mirror"; ok=1; break
              fi
              echo "::warning::$deb: $mirror failed, trying the next mirror"
            done
            [ -n "$ok" ] || { echo "::error::$deb: every mirror failed"; exit 1; }
          done

      - name: Install Agda
        timeout-minutes: 3
        run: |
          cd ~/agda-debs
          sha256sum -c - <<'EOF'
          17d3b7d5453e8a199db789bf9b199b5635e485db93864e454aa6832a03ba5902  agda-bin_2.6.3-1build1_amd64.deb
          84c8810cb45493aa26b6838928b0aec5a233d7e9ae4a0830b63cb85efc3d0388  libghc-agda-dev_2.6.3-1build1_amd64.deb
          EOF
          root="$RUNNER_TEMP/agda-root"
          mkdir -p "$root"
          for deb in *.deb; do dpkg-deb -x "$deb" "$root"; done
          # Agda_datadir must be a path with no symlink in it: through a
          # symlinked lib directory Agda rejects the builtin modules'
          # COMPILE pragmas (Agda issue #4828).
          datadir="$(realpath "$root/usr/share/libghc-agda-dev")"
          echo "AGDA=$root/usr/bin/agda" >> "$GITHUB_ENV"
          echo "Agda_datadir=$datadir" >> "$GITHUB_ENV"
          "$root/usr/bin/agda" --version

      - name: Generator diff, positive proofs and negative tests
        timeout-minutes: 8
        run: spec/agda/run-checks.sh logs/agda-ci

      - name: Upload Agda logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agda-spec-logs
          path: logs/agda-ci/
          if-no-files-found: ignore
