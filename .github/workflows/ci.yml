name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maven:
    name: Maven verify (JDK 21)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # WallpaperRubetteTest opens a Swing component, so the tests need an X
      # display. JSynPlayerTest needs an audio device and is excluded by the
      # pom's without-audio profile.
      - name: Install Xvfb if missing
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      - name: Build and test
        run: xvfb-run -a mvn -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload runnable jar
        uses: actions/upload-artifact@v7
        with:
          name: rubato-composer-jar
          path: target/rubato-composer-*-all.jar
          if-no-files-found: error

  ant:
    name: Ant dist (JDK 21)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Ant if missing
        run: command -v ant || (sudo apt-get update && sudo apt-get install -y ant)

      - name: Build rubato.jar
        run: ant -f java/build.xml dist
