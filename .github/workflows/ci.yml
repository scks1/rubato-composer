name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maven:
    name: Maven verify (JDK 21)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # WallpaperRubetteTest opens a Swing component, so the tests need an X
      # display. JSynPlayerTest needs an audio device and is excluded by the
      # pom's without-audio profile.
      - name: Install Xvfb if missing
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      - name: Build and test
        run: xvfb-run -a mvn -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: |
            java/core/target/surefire-reports/
            java/io/target/surefire-reports/
            java/target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload runnable jar
        uses: actions/upload-artifact@v7
        with:
          name: rubato-composer-jar
          # The jar finds the Apache-licensed libraries in lib/ next to it.
          path: |
            java/target/rubato-composer-*-all.jar
            java/target/lib/
          if-no-files-found: error

      - name: Upload core library jar
        uses: actions/upload-artifact@v7
        with:
          name: rubato-core-jar
          # math, logeo, XML, Scheme and Denotex, with no AWT or Swing
          path: java/core/target/rubato-core-*.jar
          if-no-files-found: error

      - name: Upload I/O library jar
        uses: actions/upload-artifact@v7
        with:
          name: rubato-io-jar
          # MusicXML, MIDI files and OSC for Score denotators; needs rubato-core
          path: java/io/target/rubato-io-*.jar
          if-no-files-found: error

  ant:
    name: Ant dist (JDK 21)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Ant if missing
        run: command -v ant || (sudo apt-get update && sudo apt-get install -y ant)

      - name: Build rubato.jar
        run: ant -f java/build.xml dist

      # Compiles java/core/src alone with only java.base, java.xml and
      # java.logging observable, so a core class that uses AWT, Swing or
      # the application fails here.
      - name: Build the core library alone
        run: ant -f java/build.xml core-jar

      # Compiles java/io/src against the core library alone, with the same
      # three modules observable.
      - name: Build the I/O library alone
        run: ant -f java/build.xml io-jar

  agda-spec:
    name: Agda spec (Agda 2.6.3 from Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The generator reads forms out of the composer jar.
      - name: Build the composer jar
        run: mvn -B -ntp -DskipTests package

      # agda-bin is the compiler; libghc-agda-dev carries the primitive
      # library under /usr/share/libghc-agda-dev/lib. The spec uses no
      # other library.
      - name: Install Agda
        run: sudo apt-get update && sudo apt-get install -y agda-bin libghc-agda-dev

      - name: Generator diff, positive proofs and negative tests
        run: spec/agda/run-checks.sh logs/agda-ci

      - name: Upload Agda logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agda-spec-logs
          path: logs/agda-ci/
          if-no-files-found: ignore
